kind = "web"
previewPath = "/"
title = "Dastarkhuwa Dashboard"
version = "1.0.0"
id = "artifacts/dastarkhuwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22002

[services.development]
run = "pnpm --filter @workspace/dastarkhuwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dastarkhuwa", "run", "build" ]
publicDir = "artifacts/dastarkhuwa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22002"
BASE_PATH = "/"
